<form action="" method="post" novalidate>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<button type="submit" name="action" value="confirm">Да</button>
<button type="submit" name="action" value="cancel">Нет</button>
</form>
{% endblock %}
